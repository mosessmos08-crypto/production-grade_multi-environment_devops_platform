name: Multi-Env DevOps Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - prod

jobs:

# 🔹 BUILD & PUSH IMAGE (DEV ONLY)
  build:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    
    environment:
        name: dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t mosesclouddev/devops-app:${{ github.sha }} .

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Image
        run: |
          docker tag mosesclouddev/devops-app:${{ github.sha }} mosesclouddev/devops-app:latest
          docker push mosesclouddev/devops-app:${{ github.sha }}
          docker push mosesclouddev/devops-app:latest


# 🔹 DEPLOY TO STAGING (AFTER MERGE → staging branch)
  deploy-staging:
    if: github.event_name == 'push' && github.ref_name == 'staging'
    runs-on: ubuntu-latest
    needs: build   # 👈 important chain

    environment:
        name: staging

    steps:
      - name: Deploy to Staging EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE="mosesclouddev/devops-app:latest"

            # install docker if not exists
            if ! command -v docker &> /dev/null
            then
              sudo yum update -y
              sudo yum install -y docker
            fi

            sudo systemctl start docker
            sudo systemctl enable docker

            sudo docker stop devops-app || true
            sudo docker rm devops-app || true

            sudo docker pull $IMAGE
            sudo docker run -d -p 5000:5000 --name devops-app --restart always $IMAGE


# 🔹 DEPLOY TO PROD (AFTER MERGE → prod branch)
  deploy-prod:
     if: github.event_name == 'push' && github.ref_name == 'prod'

    runs-on: ubuntu-latest
    needs: deploy-staging   # 👈 staging apram dhaan prod

    environment:
        name: prod

    steps:
      - name: Deploy to Production EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE="mosesclouddev/devops-app:latest"

            if ! command -v docker &> /dev/null
            then
              sudo yum update -y
              sudo yum install -y docker
            fi

            sudo systemctl start docker
            sudo systemctl enable docker

            sudo docker stop devops-app || true
            sudo docker rm devops-app || true

            sudo docker pull $IMAGE
            sudo docker run -d -p 5000:5000 --name devops-app --restart always $IMAGE